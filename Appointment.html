<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Appointment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#F4F6F8;
    padding:20px;
}

.container{
    max-width:700px;
    width:100%;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.title{
    font-size:28px;
    font-weight:600;
    color:#333;
    text-align:center;
    margin-bottom:25px;
}

.patient-detail{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
}

.input-box{
    width:calc(100% / 2 - 15px);
    margin-bottom:20px;
}

.input-box .details{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#444;
}

.input-box input,
.input-box select{
    width:100%;
    height:45px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

.duration-wrapper{
    position:relative;
}

.duration-input{
    width:100%;
}

.suggestion-list{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
    margin-top:8px;
    z-index:10;
    max-height:180px;
    overflow:auto;
}

.suggestion-list.hidden{
    display:none;
}

.suggestion-list div{
    padding:10px 12px;
    cursor:pointer;
}

.suggestion-list div:hover{
    background:#f0f4ff;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#4facfe;
    box-shadow:0 0 6px rgba(79,172,254,0.5);
}

.gender-details{
    margin:20px 0;
}

.gender-title{
    font-size:18px;
    font-weight:600;
    color:#333;
}

.category{
    display:flex;
    gap:20px;
    margin-top:10px;
}

.category label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
}

.auto-calculated{
    margin-top:10px;
}

.button{
    margin-top:25px;
}

.button input{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#4facfe;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.button input:hover{
    background:#007bff;
}

@media(max-width:584px){
    .input-box{
        width:100%;
    }

    .category{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="title">Clinic Appointment</div>

    <form id="myForm" action="/appointment" method="POST">

        <div class="patient-detail">

            <div class="input-box">
                <span class="details">Patient Name</span>
                <input type="text" id="name" name="name"
                placeholder="Enter patient name" required>
            </div>

            <div class="input-box">
                <span class="details">Address</span>
                <input type="text" id="address" name="address"
                placeholder="Enter address" required>
            </div>

            <div class="input-box">
                <span class="details">Mobile Number</span>
                <input type="tel" id="mobile" name="mobile"
                placeholder="Enter 10-digit mobile number"
                required pattern="[0-9]{10}">
            </div>

            <div class="input-box age-box">
                <span class="details">Age</span>
                <div class="duration-wrapper">
                    <input type="text" id="age" name="age" class="duration-input"
                        placeholder="e.g. 1 year 2 months 5 days"
                        autocomplete="off" required>
                    <div class="suggestion-list hidden"></div>
                </div>
            </div>


        </div>

        <div class="gender-details">
            <span class="gender-title">Gender</span>

            <div class="category">

                <label>
                    <input type="radio"
                    name="gender"
                    id="gender"
                    value="Male"
                    required>
                    Male
                </label>

                <label>
                    <input type="radio"
                    name="gender"
                    id="gender"
                    value="Female">
                    Female
                </label>

                <label>
                    <input type="radio"
                    name="gender"
                    id="gender"
                    value="Other">
                    Other
                </label>

            </div>
        </div>

        <div class="input-box">
    <span class="details">Appointment Date</span>
    <input
        type="date"
        id="dateChoose"
        name="dateChoose"
        required>
</div>

<div class="input-box">
    <span class="details">Appointment Time</span>
    <input
        type="time"
        id="timeChoose"
        name="timeChoose"
        required>
</div>


        <div class="button">
            <input type="submit" value="Submit Appointment">
        </div>

    </form>
</div>

<script>


const ageInput = document.querySelector(".duration-input");
const suggestionBox = document.querySelector(".suggestion-list");
const allUnits = ["year", "months", "days"];

function getLastNumber(value) {
    const tokens = value.trim().split(/\s+/);
    const last = tokens[tokens.length - 1];
    return /^\d+$/.test(last) ? last : null;
}

function parseUsedUnits(value) {
    const tokens = value.trim().split(/\s+/);
    const usedUnits = [];

    for (let i = 0; i < tokens.length; i += 2) {
        const number = tokens[i];
        const unit = tokens[i + 1];
        if (/^\d+$/.test(number) && allUnits.includes(unit)) {
            usedUnits.push(unit);
        }
    }

    return usedUnits;
}

function updateSuggestions() {
    const value = ageInput.value;
    const lastNumber = getLastNumber(value);
    if (!lastNumber) {
        suggestionBox.innerHTML = "";
        suggestionBox.classList.add("hidden");
        return;
    }

    const prefix = value.trim().slice(0, value.trim().lastIndexOf(lastNumber)).trim();
    const usedUnits = parseUsedUnits(prefix);
    const lastUsedIndex = usedUnits.length ? allUnits.indexOf(usedUnits[usedUnits.length - 1]) : -1;
    const validUnits = allUnits.filter(unit => !usedUnits.includes(unit) && allUnits.indexOf(unit) > lastUsedIndex);

    if (!validUnits.length) {
        suggestionBox.innerHTML = "";
        suggestionBox.classList.add("hidden");
        return;
    }

    suggestionBox.innerHTML = "";
    validUnits.forEach(unit => {
        const option = document.createElement("div");
        option.textContent = unit;
        option.addEventListener("click", () => {
            const parts = ageInput.value.trim().split(/\s+/);
            parts[parts.length - 1] = `${lastNumber} ${unit}`;
            ageInput.value = parts.join(" ") + " ";
            suggestionBox.classList.add("hidden");
            ageInput.focus();
        });
        suggestionBox.appendChild(option);
    });

    suggestionBox.classList.remove("hidden");
}

ageInput.addEventListener("input", updateSuggestions);

document.addEventListener("click", function(event) {
    if (!event.target.closest(".duration-wrapper")) {
        suggestionBox.classList.add("hidden");
    }
});

document.getElementById("myForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = {
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        age: document.getElementById("age").value,
        phone: document.getElementById("mobile").value,
        gender: document.getElementById("gender").value,
        dateChoose: document.getElementById("dateChoose").value,
        timeChoose: document.getElementById("timeChoose").value
    };

    try{

        const response = await fetch(
            "https://safesight-backend-leby.onrender.com/api/appointments/submit",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(formData)
            }
        );

        const data = await response.json();

        alert(data.message);

        this.reset();

    }catch(error){

        console.error(error);

        alert("Failed to submit appointment");

    }

});
</script>

</body>
</html>
