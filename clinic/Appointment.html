<body>
    <div class="container">
        <div class="tittle">Appointment</div>
        <form id="myForm" action="/appointment" method="POST">
            <div class="patient-detail">
                <div class="input-box">
                    <span class="details">Patient Name</span>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="input-box">
                    <span class="details">Address</span>
                    <input type="text" name="address" id="address" placeholder="Enter your Address" required>
                </div>
                <div class="input-box">
                    <span class="details">Mobile Number</span>
                    <input type="tel" id="mobile" name="mobile"  placeholder="Enter your mobile number" required pattern="[0-9]{10}">
                </div>
                <div class="input-box">
                    <span class="details">Date of Birth</span>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="input-box">
                    <span class="details">Patient Type</span>
                    <select name="status" id="status" required onchange="updateConsultationFee()">
                        <option value="" disabled selected>Select Patient Type</option>
                        <option value="New">New</option>
                        <option value="Check up">Check up</option>
                        <option value="Charity">Charity</option>
                    </select>
                </div>
               </div>
               <div class="gender-details">
                <input type="radio" name="gender" id="dot-1" value="Male" required>
                <input type="radio" name="gender" id="dot-2" value="Female">
                <input type="radio" name="gender" id="dot-3" value="Other">
                <span class="gender-tittle">Gender</span>
                <div class="category">
                    <label for="dot-1">
                        <span class="dot one"></span>
                        <span class="gender">Male</span>
                    </label>
                    <label for="dot-2">
                        <span class="dot two"></span>
                        <span class="gender">Female</span>
                    </label>
                    <label for="dot-3">
                        <span class="dot three"></span>
                        <span class="gender">Others</span>
                    </label>
                </div>
            </div>
               <div class="branch-details">
                <input type="radio" name="branch" id="branch_dot-1" value="Thoubal" required>
                <input type="radio" name="branch" id="branch_dot-2" value="Wangjing">
                <span class="branch-tittle">Convinent Centre</span>
                <div class="category">
                    <label for="branch_dot-1">
                        <span class="branch_dot one"></span>
                        <span class="branch">Thoubal Branch</span>
                    </label>
                    <label for="branch_dot-2">
                        <span class="branch_dot two"></span>
                        <span class="branch">Wanjing Branch</span>
                    </label>
                </div>
            </div>
              
               <div class="auto-calculated">
                <div class="input-box">
                    <span class="details">Age</span>
                    <input type="text" name="age" id="age" placeholder="Age will be auto-calculated" readonly>
                </div>
                <div class="input-box">
                    <span class="details">Consultation Fee</span>
                    <input type="text" id="consultation" name="consultation"   readonly>
                </div>
               </div>
            <div class="button">
                <input type="submit" name="submit" id="submit" value="Submit">
            </div>
        </form>
    </div>

function generatePatientID() {
    // Get the current date and time
    const now = new Date();

    // Extract date, hour, minute, second, and millisecond components
    const date = now.toISOString().slice(0, 10).replace(/-/g, ''); // YYYYMMDD
    const hour = now.getHours().toString().padStart(2, '0');       // HH
    const minute = now.getMinutes().toString().padStart(2, '0');   // MM
    const second = now.getSeconds().toString().padStart(2, '0');   // SS
    const microsecond = now.getMilliseconds().toString().padStart(3, '0'); // Milliseconds as 3 digits

    // Combine components to form the patient ID
    const patientID = `P${date}${hour}${minute}${second}${microsecond}`;

    return patientID;
}





    document.getElementById('dob').addEventListener('change', function() {
    // Get the Date of Birth value
    var dob = new Date(document.getElementById('dob').value);
    
    // Get the current date
    var currentDate = new Date();
    
    // Calculate the age in years
    var ageYears = currentDate.getFullYear() - dob.getFullYear();
    var monthDifference = currentDate.getMonth() - dob.getMonth();
    
    // Calculate the age in months (total months)
    var ageMonths = currentDate.getMonth() - dob.getMonth();
    if (monthDifference < 0 || (monthDifference === 0 && currentDate.getDate() < dob.getDate())) {
        ageYears--;
        monthDifference += 12;
    }

    // Calculate the total months
    var totalMonths = ageYears * 12 + monthDifference;

    // Display age in years and months
    document.getElementById('age').value = `${ageYears} years, ${monthDifference} months`;
});



function updateConsultationFee() {
    const status = document.getElementById('status').value;
    let fee;
    switch (status) {
        case 'New': fee = 'Rs.300'; break;
        case 'Check up': fee = 'Rs.200'; break;
        case 'Charity': fee = '0'; break;
        default: fee = ''; 
    }
    return fee;
}

// Update consultation field when patient type is selected
document.getElementById('status').addEventListener('change', function() {
    const fee = updateConsultationFee();
    document.getElementById('consultation').value = fee;
});

         doc.text(dateTimeString, dateTimeX, 63); // Position at top-right

          const fileName = `appointment_${sanitizedName}_${currentDate.toISOString().slice(0, 10)}.pdf`; // Format: 'appointment_Name_YYYY-MM-DD.pdf'
