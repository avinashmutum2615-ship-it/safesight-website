<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#0077cc;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:95%;
    margin:20px auto;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
    width:300px;
    padding:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

th{
    background:#0077cc;
    color:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
}

tr:hover{
    background:#eef6ff;
    cursor:pointer;
}

.details{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.details p{
    margin:10px 0;
}

.btn{
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

.delete-btn{
    background:red;
    color:white;
}

#placeholder{
    text-align:center;
    padding:40px;
    color:#777;
}

#appointmentDetails{
    display:none;
}
.details label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

.details input{
    width:100%;
    padding:10px;
    margin-top:5px;
}
#homeBtn{
    position:absolute;
    top:15px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    background:white;
    color:#0077cc;
    cursor:pointer;
    font-weight:bold;
}

</style>

</head>
<body>

<header>
    <h1>Appointment Dashboard</h1>

    <button id="homeBtn" onclick="goHome()">
        ← Back to Home
    </button>
</header>

<div class="container">

    <div class="card">
        <h3>
            Total Appointments :
            <span id="totalAppointments">0</span>
        </h3>
    </div>

    <div class="card">
        <input
            type="text"
            id="searchInput"
            placeholder="Search patient by name..."
        >
    </div>

    <table>

        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Address</th>
                <th>Phone No.</th>
                <th>Choose Date</th>
                <th>Choose Time</th>
                <th>Call</th>
                <th>Confirm</th>
            </tr>
        </thead>

        <tbody id="appointmentTable"></tbody>

    </table>

</div>

<script src="dashboard.js"></script>

</body>
</html>
