<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Appointment details · SafeSight</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">Safe<span>Sight</span></a>
      <nav>
        <a href="index.html">Clinic website</a
        ><a href="Appointment.html">Book an appointment</a
        ><a href="dashboard.html">Staff portal</a>
      </nav>
    </header>
    <main>
      <a href="dashboard.html">← Back to workspace</a>
      <h1>Appointment details</h1>
      <div id="message" role="status" hidden></div>
      <section id="details" class="card" hidden>
        <h2 id="patient"></h2>
        <p id="summary" class="muted"></p>
        <form id="edit">
          <div class="grid">
            <label
              >Date<input name="appointmentDate" type="date" required /></label
            ><label
              >Available time<select
                name="appointmentTime"
                required
              ></select></label
            ><label
              >Status<select name="status">
                <option>Pending Confirmation</option>
                <option>Confirmed</option>
                <option>Cancelled</option>
                <option>No Show</option>
              </select></label
            ><label>Reason<textarea name="reason"></textarea></label
            ><label class="full"
              >Staff notes<textarea name="notes"></textarea>
            </label>
          </div>
          <button>Save changes</button>
        </form>
        <div class="actions">
          <button id="check-in">Check in patient</button>
        </div>
      </section>
    </main>
    <footer>
      SafeSight Eye Clinic · Appointment times are in India Standard Time
    </footer>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="appointment-details.js"></script>
  </body>
</html>
